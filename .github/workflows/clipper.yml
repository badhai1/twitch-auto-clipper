name: Twitch Auto Clipper

on:
  # Erst nach erfolgreichem Twitch-Dry-Run diese drei Kommentarzeichen entfernen:
  # schedule:
  #   - cron: "3-58/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Testlauf ohne echten Twitch-Clip"
        type: boolean
        required: true
        default: true

permissions:
  contents: write

concurrency:
  group: twitch-auto-clipper
  cancel-in-progress: false

jobs:
  clipper:
    # A false repository variable skips the runner entirely until the bot is activated.
    if: github.event_name == 'workflow_dispatch' || vars.TWITCH_CLIPPER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: python -m pip install -e .

      - name: Stream prüfen und gegebenenfalls clippen
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_REFRESH_TOKEN: ${{ secrets.TWITCH_REFRESH_TOKEN }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: python -m twitch_autoclipper

      - name: Verschlüsselten Status speichern
        if: always()
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- .state/runtime.enc)" ]]; then
            echo "No encrypted state changes."
            exit 0
          fi
          git add -- .state/runtime.enc
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: persist encrypted Twitch bot state"
          git push
